name: Godot V2 Clean Rebuild CI

on:
  push:
    paths:
      - 'godot_v2/**'
      - '.github/workflows/godot-v2.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'godot_v2/**'
      - '.github/workflows/godot-v2.yml'
      - '.github/workflows/pages.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare imported Traditional Chinese font
        run: |
          python3 godot_v2/tools/prepare_font.py --project godot_v2
          python3 - <<'PY'
          from pathlib import Path
          font = Path('godot_v2/fonts/NotoSansTC-Riftforged.ttf')
          data = font.read_bytes()
          assert len(data) > 5_000_000, len(data)
          assert data[:4] == b'\x00\x01\x00\x00', data[:4]
          print('TTF source OK', len(data))

          for root in (Path('godot_v2/scripts'), Path('godot_v2/tests')):
              for path in root.rglob('*.gd'):
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      code = line.strip()
                      if code.startswith('#'):
                          continue
                      if '.load_dynamic_font(' in code:
                          raise SystemExit(f'Runtime bundled-font loading forbidden: {path}:{line_no}: {code}')
          print('Bundled font code uses imported ResourceLoader path')
          PY

      - name: Import clean rebuild
        run: godot --headless --path godot_v2 --import --quit

      # Explicit headless-only fixture runs the real portal before old suites;
      # the CAMP-01 smoke below runs without it and verifies actual camp spawn.
      - name: Headless V4 combat and progression regression
        run: godot --headless --path godot_v2 --script res://tests/v4_smoke.gd -- --camp01-legacy-combat

      - name: Headless V4 loot identity, builds and encounter integrity
        run: godot --headless --path godot_v2 --script res://tests/v4_integrity_smoke.gd -- --camp01-legacy-combat

      - name: Headless linked-gem interaction smoke test
        run: godot --headless --path godot_v2 --script res://tests/gem_smoke.gd -- --camp01-legacy-combat

      - name: Headless shared equipment inventory regression
        run: godot --headless --path godot_v2 --script res://tests/unified_inventory_smoke.gd -- --camp01-legacy-combat

      - name: Headless equip, drag and inspection regression
        run: godot --headless --path godot_v2 --script res://tests/equipment_interaction_smoke.gd -- --camp01-legacy-combat

      - name: Headless mobile landscape touch and long-press regression
        run: godot --headless --path godot_v2 --script res://tests/mobile_landscape_smoke.gd -- --camp01-legacy-combat

      - name: Headless V5 two-finger input and integrated gem regression
        run: godot --headless --path godot_v2 --script res://tests/v5_smoke.gd -- --camp01-legacy-combat

      - name: Headless configurable five-slot basic attack and gem mapping regression
        run: godot --headless --path godot_v2 --script res://tests/configurable_hotbar_smoke.gd -- --camp01-legacy-combat

      - name: Headless V5-4 aiming, trajectory and touch-release regression
        run: godot --headless --path godot_v2 --script res://tests/skill_aim_smoke.gd -- --camp01-legacy-combat

      - name: Headless CAMP-01 safe spawn, portal and inventory continuity
        run: godot --headless --path godot_v2 --script res://tests/camp_smoke.gd

      - name: Headless short landscape fit and five-button visibility regression
        run: godot --headless --path godot_v2 --script res://tests/landscape_viewport_smoke.gd

      - name: Headless responsive thumbstick, camp skill practice and real combat casting
        run: godot --headless --path godot_v2 --script res://tests/touch_skill_regression.gd

      - name: Export Web build
        run: |
          rm -rf "$GITHUB_WORKSPACE/godot-v2-web"
          mkdir -p "$GITHUB_WORKSPACE/godot-v2-web"
          godot --headless --path godot_v2 --export-release "Web" "$GITHUB_WORKSPACE/godot-v2-web/index.html"

      - name: Verify Web export files
        run: |
          test -f godot-v2-web/index.html
          test -n "$(find godot-v2-web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find godot-v2-web -maxdepth 1 -name '*.pck' -print -quit)"
          ls -lh godot-v2-web
