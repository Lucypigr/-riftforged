name: Riftforged CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: riftforged-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Browser smoke test
        run: npm run smoke:browser
