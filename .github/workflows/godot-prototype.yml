name: Godot Prototype CI

on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-prototype.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-prototype.yml'
      - '.github/workflows/pages.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path godot --import --quit

      - name: Headless scene smoke test
        run: godot --headless --path godot --script res://tests/smoke.gd

      - name: Export Web build
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot/build/web/index.html"

      - name: Verify Web export files
        run: |
          test -f godot/build/web/index.html
          test -n "$(find godot/build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find godot/build/web -maxdepth 1 -name '*.pck' -print -quit)"
          ls -lh godot/build/web
