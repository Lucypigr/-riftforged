name: Godot Prototype CI

on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-prototype.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-prototype.yml'
      - '.github/workflows/pages.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot and templates
        run: |
          godot --version
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -print | head -40 || true

      - name: Import project
        run: godot --headless --path godot --import --quit

      - name: Headless scene smoke test
        run: godot --headless --path godot --script res://tests/smoke.gd

      - name: Export Web build
        run: |
          rm -rf "$GITHUB_WORKSPACE/godot-web-build"
          mkdir -p "$GITHUB_WORKSPACE/godot-web-build"
          godot --headless --verbose --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot-web-build/index.html"

      - name: Verify Web export files
        run: |
          test -f godot-web-build/index.html
          test -n "$(find godot-web-build -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find godot-web-build -maxdepth 1 -name '*.pck' -print -quit)"
          ls -lh godot-web-build
