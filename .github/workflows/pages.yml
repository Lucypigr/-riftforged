name: Deploy Riftforged to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Build static site and Godot prototypes
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R src assets _site/

          mkdir -p _site/godot-test
          godot --headless --path godot --import --quit
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/_site/godot-test/index.html"
          test -f _site/godot-test/index.html

          mkdir -p _site/godot-v2
          python3 godot_v2/tools/prepare_font.py --project godot_v2
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot_v2/fonts/NotoSansTC-Riftforged.ttf')
          data = path.read_bytes()
          assert len(data) > 5_000_000
          assert data[:4] == b'\x00\x01\x00\x00'
          PY
          godot --headless --path godot_v2 --import --quit
          # Historical V3/V4 suites begin inside combat through the real portal
          # using an explicit test-only CLI flag. Production remains camp-first.
          godot --headless --path godot_v2 --script res://tests/v4_smoke.gd -- --camp01-legacy-combat
          godot --headless --path godot_v2 --script res://tests/v4_integrity_smoke.gd -- --camp01-legacy-combat
          godot --headless --path godot_v2 --script res://tests/v3_gem_smoke.gd -- --camp01-legacy-combat
          # No test flag: prove the exported game's default entry is the camp.
          godot --headless --path godot_v2 --script res://tests/camp_smoke.gd
          godot --headless --path godot_v2 --export-release "Web" "$GITHUB_WORKSPACE/_site/godot-v2/index.html"
          test -f _site/godot-v2/index.html
          test -n "$(find _site/godot-v2 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find _site/godot-v2 -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
